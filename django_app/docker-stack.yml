version: "3.8"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - django_network
    deploy:
      replicas: 1

  web:
    image: django_app:latest
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=django_db
      - DB_USER=django_user
      - DB_PASS=django_pass
    networks:
      - django_network
    deploy:
      replicas: 2

volumes:
  postgres_data:

networks:
  django_network:
